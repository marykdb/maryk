name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  publish-provenance-check:
    name: Publish workflow provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check action pins
        run: .github/scripts/check-action-pins.sh
      - name: Check publish workflow structure
        run: .github/scripts/check-publish-provenance.sh

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            gradle_task: "macosArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64 compileKotlinTvosArm64 compileKotlinWatchosArm32 compileKotlinWatchosArm64 compileKotlinWatchosDeviceArm64 jvmTest"
            job_name: macOS Apple Arm tests
          - os: macos-26-intel
            gradle_task: "macosX64Test"
            job_name: macOS Apple Intel tests
          - os: ubuntu-latest
            gradle_task: linuxX64Test compileKotlinLinuxArm64 wasmJsTest jsTest :store:indexeddb:wasmJsBrowserDevelopmentLibraryDistribution jvmTest :generator:jvmTest:test :generator:gradle-plugin:validatePlugins :generator:gradle-plugin:test
            job_name: Linux JVM/JS tests
          - os: windows-latest
            gradle_task: mingwX64Test :core:jvmTest
            job_name: Windows MinGW tests
      fail-fast: false
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FDB_VERSION: '7.3.75'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Detect Kotlin version
        id: detect-kotlin
        shell: bash
        run: |
          if [[ -f gradle/libs.versions.toml ]]; then
            V=$(grep -E '^[[:space:]]*kotlin[[:space:]]*=\s*"[0-9]+(\.[0-9]+)*"' -m1 gradle/libs.versions.toml | sed -E 's/.*"([0-9]+(\.[0-9]+)*)".*/\1/')
          else
            V=$(grep -R -E '^[[:space:]]*kotlin\.version[[:space:]]*=' -m1 **/gradle.properties | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/')
          fi
          echo "KOTLIN_VERSION=${V:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Kotlin/Native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/dependencies/cache/**
            ~/.konan/kotlin-native-prebuilt-*
          key: konan-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}
          restore-keys: |
            konan-deps-${{ runner.os }}-${{ runner.arch }}

      - name: Cache FoundationDB binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            store/foundationdb/bin/**
          key: fdb-${{ runner.os }}-${{ runner.arch }}-${{ env.FDB_VERSION }}-${{ hashFiles('store/foundationdb/scripts/install-foundationdb.sh') }}
          restore-keys: |
            fdb-${{ runner.os }}-${{ runner.arch }}

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Playwright browsers
        id: playwright-browsers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('store/indexeddb/browser-smoke/package-lock.json') }}

      - name: Install browser smoke dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: store/indexeddb/browser-smoke
        shell: bash
        run: npm ci

      - name: Install Firefox, WebKit, and system dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: store/indexeddb/browser-smoke
        shell: bash
        run: npx playwright install --with-deps firefox webkit

      - name: Configure Firefox
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          FIREFOX_BIN="$(find "$HOME/.cache/ms-playwright" -path '*/firefox/firefox' -type f -print -quit)"
          test -n "$FIREFOX_BIN"
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"

      - name: Run Gradle tasks
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
        shell: bash
        run: ./gradlew ${{ matrix.gradle_task }} --dependency-verification=strict --stacktrace --build-cache --no-parallel

      - name: Run native WebKit Maryk IndexedDB smoke
        if: matrix.os == 'ubuntu-latest'
        working-directory: store/indexeddb/browser-smoke
        shell: bash
        run: npm test

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-build-report-${{ runner.os }}-${{ runner.arch }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          compression-level: 9

  android:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew testAndroidHostTest connectedAndroidDeviceTest compileKotlinAndroidNativeArm32 compileKotlinAndroidNativeArm64 compileKotlinAndroidNativeX86 compileKotlinAndroidNativeX64 --dependency-verification=strict --stacktrace --build-cache --no-parallel

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-report-${{ runner.os }}-${{ runner.arch }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          compression-level: 9

name: Publish
on:
  workflow_run:
    workflows: [ Build ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to publish
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}"
  cancel-in-progress: false

jobs:
  maven-publish:
    runs-on: macos-latest # macOS supports building all Kotlin targets
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      EXPECTED_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_REF }}
          fetch-depth: 0

      - name: Verify publish provenance
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && ! "$EXPECTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Manual publish ref must be a full 40-character commit SHA" >&2
            exit 1
          fi
          bash .github/scripts/verify-build-provenance.sh
          echo "MARYK_PUBLISH_SHA=$MARYK_BUILD_SHA" >> "$GITHUB_ENV"
          {
            echo "commit_sha=$MARYK_BUILD_SHA"
            echo "build_run_id=$MARYK_BUILD_RUN_ID"
          } > publish-provenance.txt
          echo "Publishing commit \`$MARYK_BUILD_SHA\` from Build run \`$MARYK_BUILD_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache Kotlin Konan
        id: cache-kotlin-konan
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/**/*
          key: kotlin-konan-${{ runner.os }}

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build the project
        # Maven Central _really_ doesn't like parallel uploads, so disable parallelization
        run: ./gradlew publish --dependency-verification=strict --no-configuration-cache --no-parallel
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{secrets.MARYK_SIGNING_KEY}}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{secrets.MARYK_SIGNING_PASSWORD}}

      - name: Upload publish provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-provenance-${{ env.MARYK_PUBLISH_SHA }}
          path: publish-provenance.txt
          if-no-files-found: error

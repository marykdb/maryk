name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}"
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release provenance
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.provenance.outputs.source_sha }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify published release and version
        id: provenance
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != "false" ]]; then
              echo "Release $TAG is still a draft" >&2
              exit 1
            fi
          fi
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "$ACTUAL_SHA" != "$TAG_SHA" ]]; then
            echo "Checked out $ACTUAL_SHA, but tag $TAG resolves to $TAG_SHA" >&2
            exit 1
          fi
          EXPECTED_SHA="$ACTUAL_SHA" bash .github/scripts/verify-build-provenance.sh
          ./gradlew :app:verifyDistributionVersion -PreleaseTag="$TAG" --no-daemon
          echo "source_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

  distributions:
    name: ${{ matrix.name }}
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64 DMG and CLI
            gradle_task: :app:packageDmg :cli:nativeDistZipMacosArm64
            cli_platform: macos-arm64
          - os: ubuntu-latest
            name: Linux DEB and CLI
            gradle_task: :app:packageDeb :cli:nativeDistZipLinuxX64
            cli_platform: linux-x64
          - os: windows-latest
            name: Windows MSI
            gradle_task: :app:packageMsi
            cli_platform: ''
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_SHA: ${{ needs.verify-release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Reassert release tag provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-cleanup: on-success

      - name: Build distribution
        shell: bash
        run: ./gradlew :app:verifyDistributionVersion ${{ matrix.gradle_task }} -PreleaseTag="$RELEASE_TAG" --stacktrace --build-cache --no-parallel

      - name: Smoke test native CLI bundle
        if: matrix.cli_platform != ''
        shell: bash
        run: |
          archive=$(find cli/build/distributions -maxdepth 1 -name "maryk-cli-*-${{ matrix.cli_platform }}.zip" -print -quit)
          test -n "$archive"
          bash cli/scripts/verify-native-bundle.sh "$archive" "${{ matrix.cli_platform }}"

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find app/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"

          mount_point=$(mktemp -d)
          smoke_home=$(mktemp -d)
          smoke_store=$(mktemp -d)
          smoke_log="$RUNNER_TEMP/maryk-macos-smoke.log"
          app_pid=''
          mounted=false
          stop_app() {
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              pkill -TERM -P "$app_pid" 2>/dev/null || true
              kill -TERM "$app_pid" 2>/dev/null || true
              for _ in {1..5}; do
                kill -0 "$app_pid" 2>/dev/null || break
                sleep 1
              done
              pkill -KILL -P "$app_pid" 2>/dev/null || true
              kill -KILL "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            app_pid=''
          }
          cleanup() {
            stop_app
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_point" -force >/dev/null || true
            fi
            rm -rf -- "$smoke_home"
            rm -rf -- "$smoke_store"
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          mounted=true
          app=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          executable_name=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"

          HOME="$smoke_home" "$executable" --smoke-store "$smoke_store" >"$smoke_log" 2>&1 &
          app_pid=$!
          for _ in {1..60}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "$app_pid" 2>/dev/null; then
            stop_app
            cat "$smoke_log" >&2
            echo "Packaged macOS app store smoke timed out after 60 seconds" >&2
            exit 1
          fi
          status=0
          wait "$app_pid" || status=$?
          app_pid=''
          if [[ "$status" -ne 0 ]]; then
            cat "$smoke_log" >&2
            echo "Packaged macOS app store smoke failed with status $status" >&2
            exit 1
          fi
          grep -Fx 'MARYK_PACKAGED_STORE_SMOKE_OK' "$smoke_log"

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find app/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          package_name=$(dpkg-deb --field "$deb" Package)
          [[ "$package_name" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]
          smoke_home=$(mktemp -d)
          smoke_log="$RUNNER_TEMP/maryk-linux-smoke.log"
          install_attempted=false
          cleanup() {
            if [[ "$install_attempted" == true ]]; then
              sudo dpkg --purge "$package_name" >/dev/null || true
            fi
            rm -rf -- "$smoke_home"
          }
          trap cleanup EXIT

          install_attempted=true
          sudo dpkg --install "$deb"
          launcher=$(dpkg-query --listfiles "$package_name" | awk '/\/bin\/[^/]+$/ { print; exit }')
          test -x "$launcher"

          status=0
          HOME="$smoke_home" timeout --signal=TERM --kill-after=5s 10s xvfb-run -a "$launcher" >"$smoke_log" 2>&1 || status=$?
          if [[ "$status" -ne 124 ]]; then
            cat "$smoke_log" >&2
            echo "Packaged Linux app exited during startup with status $status" >&2
            exit 1
          fi
          echo "Packaged Linux app remained alive for 10 seconds"

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'app/build/compose/binaries/main/msi' -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) {
            throw 'No MSI package found'
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'maryk-msi-smoke'
          $installLog = Join-Path $env:RUNNER_TEMP 'maryk-msi-install.log'
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'maryk-windows-smoke.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'maryk-windows-smoke.stderr.log'
          $smokeProfile = Join-Path $env:RUNNER_TEMP 'maryk-windows-smoke-profile'
          $appProcess = $null
          $installAttempted = $false
          try {
            $installAttempted = $true
            $installArgs = "/i `"$($msi.FullName)`" /qn /norestart INSTALLDIR=`"$installRoot`" /L*v `"$installLog`""
            $installer = Start-Process msiexec.exe -ArgumentList $installArgs -Wait -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) {
              Get-Content $installLog -ErrorAction SilentlyContinue
              throw "MSI install failed with exit code $($installer.ExitCode)"
            }

            $searchRoots = @($installRoot, (Join-Path $env:ProgramFiles 'Maryk')) | Where-Object { Test-Path $_ }
            $executable = $searchRoots |
              ForEach-Object { Get-ChildItem $_ -Filter 'Maryk.exe' -File -Recurse -ErrorAction SilentlyContinue } |
              Select-Object -First 1
            if (-not $executable) {
              throw 'Installed Maryk.exe not found'
            }

            $env:USERPROFILE = $smokeProfile
            $env:APPDATA = Join-Path $smokeProfile 'AppData/Roaming'
            $env:LOCALAPPDATA = Join-Path $smokeProfile 'AppData/Local'
            New-Item $env:APPDATA, $env:LOCALAPPDATA -ItemType Directory -Force | Out-Null
            $appProcess = Start-Process $executable.FullName -WorkingDirectory $executable.DirectoryName -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
            Start-Sleep -Seconds 10
            if ($appProcess.HasExited) {
              Get-Content $stdoutLog -ErrorAction SilentlyContinue
              Get-Content $stderrLog -ErrorAction SilentlyContinue
              throw "Packaged Windows app exited during startup with status $($appProcess.ExitCode)"
            }
            Write-Output 'Packaged Windows app remained alive for 10 seconds'
          }
          finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              taskkill.exe /PID $($appProcess.Id) /T /F | Out-Null
            }
            if ($installAttempted) {
              $uninstallArgs = "/x `"$($msi.FullName)`" /qn /norestart"
              $uninstaller = Start-Process msiexec.exe -ArgumentList $uninstallArgs -Wait -PassThru
              if ($uninstaller.ExitCode -notin @(0, 1605, 3010)) {
                Write-Warning "MSI cleanup failed with exit code $($uninstaller.ExitCode)"
              }
            }
            Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $smokeProfile -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maryk-distribution-${{ runner.os }}-${{ runner.arch }}
          path: |
            app/build/compose/binaries/main/**/*.dmg
            app/build/compose/binaries/main/**/*.msi
            app/build/compose/binaries/main/**/*.deb
            cli/build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0

  attach-installers:
    name: Attach installers to release
    needs: [verify-release, distributions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_SHA: ${{ needs.verify-release.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: maryk-distribution-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          mkdir release-upload
          while IFS= read -r -d '' file; do
            target="release-upload/$(basename "$file")"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset basename: $(basename "$file")" >&2
              exit 1
            fi
            mv "$file" "$target"
          done < <(find release-assets -type f -print0)
          cd release-upload
          find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Reassert release tag provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"

      - name: Attach artifacts
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-upload/* --clobber

name: Deploy website to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "website-pages-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_PATH: website

jobs:
  validate:
    name: Validate website
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build synchronized website
        uses: ./.github/actions/build-website

  build:
    name: Build deployment artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Use HTTPS Pages origin
        id: website
        run: |
          ORIGIN="${{ steps.pages.outputs.origin }}"
          ORIGIN="${ORIGIN/http:/https:}"
          echo "astro_arguments=--site $ORIGIN --base ${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
      - name: Build synchronized website
        uses: ./.github/actions/build-website
        with:
          astro-arguments: ${{ steps.website.outputs.astro_arguments }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

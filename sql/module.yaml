product:
  type: kmp/lib
  platforms: [jvm, android, js, wasmJs, linuxX64, linuxArm64, mingwX64, iosX64, iosArm64, iosSimulatorArm64, macosArm64, macosX64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, tvosArm64, tvosSimulatorArm64, androidNativeArm32, androidNativeArm64, androidNativeX86, androidNativeX64]

apply:
  - //toolchain/common.module-template.yaml
  - //toolchain/publishing.module-template.yaml

dependencies:
  - //core: exported
  - //store/shared: exported
  - $libs.kotlinx.coroutines.core: exported
  - $libs.kotlinx.datetime: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - //store/memory
  - //testmodels

settings:
  publishing:
    artifactId: maryk-sql
  android:
    namespace: io.maryk
    compileSdk: 36
    minSdk: 21
